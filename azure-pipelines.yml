trigger:
  - main

pool:
  name: 'CartFlow-Agent-Pool'

steps:

# =========================================================
# 1. Checkout CartFlow source code
# =========================================================
- checkout: self
  displayName: 'Checkout CartFlow Source Code'


# =========================================================
# 2. Verify tools installed on the self-hosted agent
# =========================================================
- script: |
    echo "Checking build environment..."
    echo "-----------------------------"
    java -version
    mvn -version
    git --version
  displayName: 'Verify Build Tools'


# =========================================================
# 3. Prepare SonarQube analysis
# =========================================================
- task: SonarQubePrepare@8
  displayName: 'Prepare SonarQube Analysis'
  inputs:
    SonarQube: 'CartFlow-SonarQube'
    scannerMode: 'other'
    extraProperties: |
      sonar.projectKey=CartFlow
      sonar.projectName=CartFlow


# =========================================================
# 4. Maven build + unit tests
# =========================================================
- task: Maven@4
  displayName: 'Maven Build and Test'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package'

    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

    javaHomeOption: 'Path'
    jdkDirectory: '/usr/lib/jvm/java-17-openjdk-amd64'

    mavenVersionOption: 'Default'

    sonarQubeRunAnalysis: false


# =========================================================
# 5. Run SonarQube Analysis
# =========================================================
- script: |
    mvn sonar:sonar \
      -Dsonar.projectKey=CartFlow \
      -Dsonar.projectName=CartFlow
  displayName: 'Maven SonarQube Analysis'


# =========================================================
# 6. Publish SonarQube Quality Gate result
# =========================================================
- task: SonarQubePublish@8
  displayName: 'Publish SonarQube Quality Gate'
  inputs:
    pollingTimeoutSec: '300'


# =========================================================
# 7. Publish generated CartFlow JAR
# =========================================================
- task: PublishPipelineArtifact@1
  displayName: 'Publish CartFlow JAR'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/target'
    artifact: 'CartFlow'